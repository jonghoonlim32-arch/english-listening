<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘 영어 모바일 듣기 10회</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f7;margin:0;color:#111}main{max-width:720px;margin:auto;padding:18px 14px 40px}.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 4px 18px #0001;margin-bottom:14px}h1{font-size:21px;margin:0 0 10px}.status{padding:12px 14px;border-radius:14px;background:#f0f0f3;line-height:1.5;margin:10px 0;font-size:14px}.good{background:#eaf7ee}.warn{background:#fff3d9}.bad{background:#fdecec}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button{border:0;border-radius:12px;padding:12px 14px;font-size:16px}.primary{background:#111;color:#fff}.secondary{background:#ececf1;color:#111}select{font-size:16px;padding:10px;border-radius:10px}.small{font-size:13px;color:#666;line-height:1.55}
</style></head><body><main>
<div class="card"><h1>오늘 영어 듣기 · 10회 반복</h1>
<div id="env" class="status">환경 확인 중...</div><div id="wake" class="status">Wake Lock 상태 확인 중...</div>
<div class="controls"><button id="play" class="primary">재생 / 이어듣기</button><button id="pause" class="secondary">일시정지</button><button id="stop" class="secondary">정지</button><button id="restart" class="secondary">처음부터</button></div>
<div class="controls"><label>속도 <select id="rate"><option value="0.85">0.85</option><option value="0.95">0.95</option><option value="1" selected>1.0</option><option value="1.1">1.1</option><option value="1.2">1.2</option></select></label></div>
<div id="progress" class="small" style="margin-top:12px">대기 중</div></div>
<div class="card small"><b>Wake Lock 안내</b><br>일반 Chrome의 HTTPS 페이지에서는 재생 중 화면 자동 꺼짐을 막도록 Wake Lock을 자동 요청해.</div>
</main><script>
const sentences=["I'm not sure if I can make it today.","I'll let you know when I'm done with work.","It took longer than I expected.","I haven't decided what to do this weekend yet.","Seeing my daughter ride the elevator by herself made me realize how fast she's growing.","I've never heard that before.","My oldest daughter is really smart.","Cats are cute and fuzzy.","I have to get out of here.","It's time to go to bed.","When she was little, she looked like a tiny kitten.","What advice should I give my daughter?","I don't know exactly how to say it.","I'm not exactly sure what she likes.","Sometimes it's fun to joke around and tease each other."];
let setIndex=0,sentenceIndex=0,playing=false,paused=false,stopped=false,wakeLock=null,timer=null;const totalSets=10,sentenceGap=2000,setGap=4000;const env=document.getElementById('env'),wake=document.getElementById('wake'),progress=document.getElementById('progress'),rate=document.getElementById('rate');
function showEnv(){env.className='status good';env.innerHTML='<b>현재 환경: 일반 HTTPS 페이지</b><br>Wake Lock을 자동으로 시도할게.';}
async function requestWake(){if(!('wakeLock' in navigator)){wake.className='status bad';wake.innerHTML='<b>Wake Lock: 미지원</b>';return false;}try{if(wakeLock&&!wakeLock.released)return true;wakeLock=await navigator.wakeLock.request('screen');wake.className='status good';wake.innerHTML='<b>Wake Lock: 활성화됨</b><br>재생 중 화면 자동 꺼짐을 막고 있어.';wakeLock.addEventListener('release',()=>{wake.className='status warn';wake.innerHTML='<b>Wake Lock: 해제됨</b><br>페이지가 다시 보이면 재요청할게.';});return true;}catch(e){wake.className='status bad';wake.innerHTML='<b>Wake Lock: 사용 불가</b><br>'+e.name+': '+e.message;return false;}}
async function releaseWake(){try{if(wakeLock&&!wakeLock.released)await wakeLock.release();}catch(e){}wakeLock=null;}
function updateProgress(){progress.textContent=`반복 ${setIndex+1} / ${totalSets} · 문장 ${sentenceIndex+1} / ${sentences.length}`;}
function speak(){if(!playing||paused||stopped)return;if(setIndex>=totalSets){finish();return;}updateProgress();const u=new SpeechSynthesisUtterance(sentences[sentenceIndex]);u.lang='en-US';u.rate=parseFloat(rate.value||'1');u.pitch=1;u.onend=()=>{if(!playing||paused||stopped)return;sentenceIndex++;let wait=sentenceGap;if(sentenceIndex>=sentences.length){sentenceIndex=0;setIndex++;wait=setGap;}if(setIndex>=totalSets){finish();return;}timer=setTimeout(speak,wait);};u.onerror=(ev)=>{if(!playing||paused||stopped)return;if(ev.error==='canceled'||ev.error==='interrupted')return;timer=setTimeout(()=>{requestWake();speak();},1200);};speechSynthesis.speak(u);}
async function start(){stopped=false;if(paused){paused=false;playing=true;speechSynthesis.resume();await requestWake();if(!speechSynthesis.speaking&&!speechSynthesis.pending)speak();}else if(!playing){playing=true;await requestWake();speak();}}
async function pauseFn(){paused=true;playing=false;clearTimeout(timer);speechSynthesis.pause();await releaseWake();progress.textContent+=' · 일시정지';}
async function stopFn(){paused=false;playing=false;stopped=true;clearTimeout(timer);speechSynthesis.cancel();await releaseWake();progress.textContent='정지됨';}
async function restartFn(){await stopFn();setIndex=0;sentenceIndex=0;stopped=false;progress.textContent='처음부터 대기 중';}
async function finish(){playing=false;paused=false;stopped=true;speechSynthesis.cancel();await releaseWake();progress.textContent='10회 반복 완료';}
document.getElementById('play').onclick=start;document.getElementById('pause').onclick=pauseFn;document.getElementById('stop').onclick=stopFn;document.getElementById('restart').onclick=restartFn;document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'){showEnv();if(playing||paused){await requestWake();if(paused){paused=false;playing=true;}if(!speechSynthesis.speaking&&!speechSynthesis.pending)speak();else speechSynthesis.resume();}}});window.addEventListener('pageshow',async()=>{showEnv();if(playing){await requestWake();if(!speechSynthesis.speaking&&!speechSynthesis.pending)speak();}});showEnv();wake.innerHTML='<b>Wake Lock:</b> 재생 버튼을 누르면 자동 확인할게.';
</script></body></html>
