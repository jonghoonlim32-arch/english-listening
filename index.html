<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오늘 영어 듣기</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f7;margin:0;color:#111}main{max-width:720px;margin:auto;padding:18px 14px 40px}.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 4px 18px #0001;margin-bottom:14px}h1{font-size:21px;margin:0 0 10px}.status{padding:12px 14px;border-radius:14px;background:#f0f0f3;line-height:1.5;margin:10px 0;font-size:14px}.good{background:#eaf7ee}.warn{background:#fff3d9}.bad{background:#fdecec}.now{padding:18px;border-radius:16px;background:#f7f7f9;margin:14px 0}.en{font-size:22px;font-weight:700;line-height:1.45;margin-bottom:10px}.ko{font-size:17px;line-height:1.55;color:#444}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button{border:0;border-radius:12px;padding:12px 14px;font-size:16px}.primary{background:#111;color:#fff}.secondary{background:#ececf1}select{font-size:16px;padding:10px;border-radius:10px}.small{font-size:13px;color:#666;line-height:1.55}</style></head><body><main><div class="card"><h1>오늘 영어 듣기 · 10회 반복</h1><div id="env" class="status good"><b>현재 환경: 일반 HTTPS 페이지</b><br>Wake Lock을 자동으로 시도할게.</div><div id="wake" class="status"><b>Wake Lock:</b> 재생 버튼을 누르면 자동 확인할게.</div><div class="now"><div id="en" class="en"></div><div id="ko" class="ko"></div></div><div class="controls"><button id="play" class="primary">재생 / 이어듣기</button><button id="pause" class="secondary">일시정지</button><button id="stop" class="secondary">정지</button><button id="restart" class="secondary">처음부터</button></div><div class="controls"><label>속도 <select id="rate"><option>.85</option><option>.95</option><option selected>1.0</option><option>1.1</option><option>1.2</option></select></label></div><div id="progress" class="small" style="margin-top:12px">대기 중</div></div></main><script>const items=[['오늘 갈 수 있을지 잘 모르겠어.',"I'm not sure if I can make it today."],['일이 끝나면 알려줄게.',"I'll let you know when I'm done with work."],['생각했던 것보다 시간이 더 오래 걸렸어.',"It took longer than I expected."],['이번 주말에 뭘 할지 아직 결정하지 못했어.',"I haven't decided what to do this weekend yet."],['딸이 혼자 엘리베이터를 타는 걸 보니까 정말 빨리 크고 있다는 게 실감 났어.',"Seeing my daughter ride the elevator by herself made me realize how fast she's growing."],['나는 그 말을 전에 들어본 적이 없어.',"I've never heard that before."],['우리 큰딸은 정말 똑똑해.',"My oldest daughter is really smart."],['고양이는 귀엽고 털이 복슬복슬해.',"Cats are cute and fuzzy."],['나 여기서 도망가야겠어.',"I have to get out of here."],['이제 잘 시간이야.',"It's time to go to bed."],['어렸을 때 우리 딸은 작은 고양이처럼 보였어.',"When she was little, she looked like a tiny kitten."],['우리 딸에게 어떤 조언을 해주면 좋을까?',"What advice should I give my daughter?"],['정확히 어떻게 표현해야 할지 모르겠어.',"I don't know exactly how to say it."],['딸이 뭘 좋아하는지 정확히는 모르겠어.',"I'm not exactly sure what she likes."],['가끔 딸과 장난치면서 서로 놀리는 게 재미있어.',"Sometimes it's fun to joke around and tease each other."]];let si=0,ri=0,playing=false,paused=false,wakeLock=null,timer=null;const total=10,gap=2000,setGap=4000,$=id=>document.getElementById(id);function show(){ $('en').textContent=items[si][1];$('ko').textContent=items[si][0];$('progress').textContent=`반복 ${ri+1} / ${total} · 문장 ${si+1} / ${items.length}`;}async function wake(){try{if(!('wakeLock'in navigator))throw new Error('미지원');if(wakeLock&&!wakeLock.released)return;wakeLock=await navigator.wakeLock.request('screen');$('wake').className='status good';$('wake').innerHTML='<b>Wake Lock: 활성화됨</b><br>재생 중 화면 자동 꺼짐을 막고 있어.';}catch(e){$('wake').className='status bad';$('wake').innerHTML='<b>Wake Lock: 사용 불가</b><br>'+e.message;}}async function release(){try{if(wakeLock&&!wakeLock.released)await wakeLock.release()}catch(e){}wakeLock=null}function speak(){if(!playing||paused||ri>=total)return;show();let u=new SpeechSynthesisUtterance(items[si][1]);u.lang='en-US';u.rate=parseFloat($('rate').value);u.onend=()=>{if(!playing||paused)return;si++;let w=gap;if(si>=items.length){si=0;ri++;w=setGap}if(ri>=total){playing=false;release();$('progress').textContent='10회 반복 완료';return}timer=setTimeout(speak,w)};u.onerror=()=>{if(playing&&!paused)timer=setTimeout(speak,1200)};speechSynthesis.speak(u)}$('play').onclick=async()=>{if(paused){paused=false;playing=true;speechSynthesis.resume();await wake();if(!speechSynthesis.speaking)speak()}else if(!playing){playing=true;await wake();speak()}};$('pause').onclick=async()=>{paused=true;playing=false;clearTimeout(timer);speechSynthesis.pause();await release();$('progress').textContent+=' · 일시정지'};$('stop').onclick=async()=>{playing=false;paused=false;clearTimeout(timer);speechSynthesis.cancel();await release();$('progress').textContent='정지됨'};$('restart').onclick=async()=>{playing=false;paused=false;clearTimeout(timer);speechSynthesis.cancel();await release();si=0;ri=0;show();$('progress').textContent='처음부터 대기 중'};document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&playing){await wake();if(!speechSynthesis.speaking)speak()}});show();</script></body></html>
