<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오늘 영어 듣기</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f7;margin:0;color:#111}main{max-width:720px;margin:auto;padding:18px 14px 40px}.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 4px 18px #0001;margin-bottom:14px}h1{font-size:21px;margin:0 0 10px}.status{padding:12px 14px;border-radius:14px;background:#f0f0f3;line-height:1.5;margin:10px 0;font-size:14px}.good{background:#eaf7ee}.bad{background:#fdecec}.now{padding:18px;border-radius:16px;background:#f7f7f9;margin:14px 0}.en{font-size:22px;font-weight:700;line-height:1.45;margin-bottom:10px}.ko{font-size:17px;line-height:1.55;color:#444}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button{border:0;border-radius:12px;padding:12px 14px;font-size:16px}.primary{background:#111;color:#fff}.secondary{background:#ececf1}select{font-size:16px;padding:10px;border-radius:10px}.small{font-size:13px;color:#666;line-height:1.55}</style></head><body><main><div class="card"><h1>오늘 영어 듣기 · 10월 1일 · 10회 반복</h1><div id="env" class="status good"><b>현재 환경: 일반 HTTPS 페이지</b><br>Wake Lock을 자동으로 시도할게.</div><div id="wake" class="status"><b>Wake Lock:</b> 재생 버튼을 누르면 자동 확인할게.</div><div class="now"><div id="en" class="en"></div><div id="ko" class="ko"></div></div><div class="controls"><button id="play" class="primary">재생 / 이어듣기</button><button id="pause" class="secondary">일시정지</button><button id="stop" class="secondary">정지</button><button id="restart" class="secondary">처음부터</button></div><div class="controls"><label>속도 <select id="rate"><option>.85</option><option>.95</option><option selected>1.0</option><option>1.1</option><option>1.2</option></select></label></div><div id="progress" class="small" style="margin-top:12px">대기 중</div></div></main><script>const items=[['나 거의 다 했어.',"I'm almost done."],['나한테 맡겨.',"Leave it to me."],['지금 확인해 볼게.',"I'll check right now."],['그거 괜찮을 것 같아.',"That should be fine."],['아직 준비가 안 됐어.',"I'm not ready yet."],['오늘 제시간에 도착할 수 있을지 잘 모르겠어.',"I'm not sure if I can get there on time today."],['생각했던 것보다 문제를 해결하는 데 오래 걸렸어.',"It took longer than I expected to solve the problem."],['일이 끝나는 대로 전화할게.',"I'll call you as soon as I'm done with work."],['지금 결정할 필요는 없으니까 조금 더 생각해 봐.',"You don't have to decide now, so take some time to think about it."],['처음에는 어려웠지만 이제는 조금씩 익숙해지고 있는 것 같아.',"It was difficult at first, but I feel like I'm slowly getting used to it."]];let si=0,ri=0,playing=false,paused=false,wakeLock=null,timer=null;const total=10,gap=2000,setGap=4000,$=id=>document.getElementById(id);function show(){$('en').textContent=items[si][1];$('ko').textContent=items[si][0];$('progress').textContent=`반복 ${ri+1} / ${total} · 문장 ${si+1} / ${items.length}`;}async function wake(){try{if(!('wakeLock'in navigator))throw new Error('미지원');if(wakeLock&&!wakeLock.released)return;wakeLock=await navigator.wakeLock.request('screen');$('wake').className='status good';$('wake').innerHTML='<b>Wake Lock: 활성화됨</b><br>재생 중 화면 자동 꺼짐을 막고 있어.';}catch(e){$('wake').className='status bad';$('wake').innerHTML='<b>Wake Lock: 사용 불가</b><br>'+e.message;}}async function release(){try{if(wakeLock&&!wakeLock.released)await wakeLock.release()}catch(e){}wakeLock=null}function speak(){if(!playing||paused||ri>=total)return;show();const u=new SpeechSynthesisUtterance(items[si][1]);u.lang='en-US';u.rate=parseFloat($('rate').value);u.onend=()=>{if(!playing||paused)return;si++;let w=gap;if(si>=items.length){si=0;ri++;w=setGap}if(ri>=total){playing=false;release();$('progress').textContent='10회 반복 완료';return}timer=setTimeout(speak,w)};u.onerror=()=>{if(playing&&!paused)timer=setTimeout(speak,1200)};speechSynthesis.speak(u)}$('play').onclick=async()=>{if(paused){paused=false;playing=true;speechSynthesis.resume();await wake();if(!speechSynthesis.speaking)speak()}else if(!playing){playing=true;await wake();speak()}};$('pause').onclick=async()=>{paused=true;playing=false;clearTimeout(timer);speechSynthesis.pause();await release();$('progress').textContent+=' · 일시정지'};$('stop').onclick=async()=>{playing=false;paused=false;clearTimeout(timer);speechSynthesis.cancel();await release();$('progress').textContent='정지됨'};$('restart').onclick=async()=>{playing=false;paused=false;clearTimeout(timer);speechSynthesis.cancel();await release();si=0;ri=0;show();$('progress').textContent='처음부터 대기 중'};document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&playing){await wake();if(!speechSynthesis.speaking)speak()}});show();</script></body></html>
