<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오늘 영어 듣기</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f7;margin:0;color:#111}main{max-width:720px;margin:auto;padding:18px 14px 40px}.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 4px 18px #0001;margin-bottom:14px}h1{font-size:21px;margin:0 0 10px}.status{padding:12px 14px;border-radius:14px;background:#f0f0f3;line-height:1.5;margin:10px 0;font-size:14px}.good{background:#eaf7ee}.bad{background:#fdecec}.now{padding:18px;border-radius:16px;background:#f7f7f9;margin:14px 0}.en{font-size:22px;font-weight:700;line-height:1.45;margin-bottom:10px}.ko{font-size:17px;line-height:1.55;color:#444}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button{border:0;border-radius:12px;padding:12px 14px;font-size:16px}.primary{background:#111;color:#fff}.secondary{background:#ececf1}select{font-size:16px;padding:10px;border-radius:10px}.small{font-size:13px;color:#666;line-height:1.55}</style></head><body><main><div class="card"><h1>오늘 영어 듣기 · 9월 12일 · 10회 반복</h1><div id="env" class="status good"><b>현재 환경: 일반 HTTPS 페이지</b><br>Wake Lock을 자동으로 시도할게.</div><div id="wake" class="status"><b>Wake Lock:</b> 재생 버튼을 누르면 자동 확인할게.</div><div class="now"><div id="en" class="en"></div><div id="ko" class="ko"></div></div><div class="controls"><button id="play" class="primary">재생 / 이어듣기</button><button id="pause" class="secondary">일시정지</button><button id="stop" class="secondary">정지</button><button id="restart" class="secondary">처음부터</button></div><div class="controls"><label>속도 <select id="rate"><option>.85</option><option>.95</option><option selected>1.0</option><option>1.1</option><option>1.2</option></select></label></div><div id="progress" class="small" style="margin-top:12px">대기 중</div></div></main><script>const items=[['거의 다 왔어.',"I'm almost there."],['잠깐 생각해 볼게.',"Let me think about it."],['나중에 다시 전화할게.',"I'll call you back later."],['오늘은 그냥 집에 있고 싶어.',"I just want to stay home today."],['그거 괜찮은 생각인 것 같아.',"That sounds like a good idea."],['생각했던 것보다 집에 늦게 도착할 것 같아.',"I think I'll get home later than I expected."],['내일 시간이 될지 아직 확실하지 않아.',"I'm not sure if I'll have time tomorrow."],['결정하기 전에 조금 더 생각해보고 싶어.',"I'd like to think about it a little more before I decide."],['요즘 딸이 점점 더 독립적으로 변하는 것 같아.',"I feel like my daughter is becoming more independent these days."],['그때는 무슨 말을 해야 할지 몰랐는데, 지금은 어떻게 말할지 알 것 같아.',"I didn't know what to say then, but now I think I know how to say it."]];let si=0,ri=0,playing=false,paused=false,wakeLock=null,timer=null;const total=10,gap=2000,setGap=4000,$=id=>document.getElementById(id);function show(){$('en').textContent=items[si][1];$('ko').textContent=items[si][0];$('progress').textContent=`반복 ${ri+1} / ${total} · 문장 ${si+1} / ${items.length}`;}async function wake(){try{if(!('wakeLock'in navigator))throw new Error('미지원');if(wakeLock&&!wakeLock.released)return;wakeLock=await navigator.wakeLock.request('screen');$('wake').className='status good';$('wake').innerHTML='<b>Wake Lock: 활성화됨</b><br>재생 중 화면 자동 꺼짐을 막고 있어.';}catch(e){$('wake').className='status bad';$('wake').innerHTML='<b>Wake Lock: 사용 불가</b><br>'+e.message;}}async function release(){try{if(wakeLock&&!wakeLock.released)await wakeLock.release()}catch(e){}wakeLock=null}function speak(){if(!playing||paused||ri>=total)return;show();const u=new SpeechSynthesisUtterance(items[si][1]);u.lang='en-US';u.rate=parseFloat($('rate').value);u.onend=()=>{if(!playing||paused)return;si++;let w=gap;if(si>=items.length){si=0;ri++;w=setGap}if(ri>=total){playing=false;release();$('progress').textContent='10회 반복 완료';return}timer=setTimeout(speak,w)};u.onerror=()=>{if(playing&&!paused)timer=setTimeout(speak,1200)};speechSynthesis.speak(u)}$('play').onclick=async()=>{if(paused){paused=false;playing=true;speechSynthesis.resume();await wake();if(!speechSynthesis.speaking)speak()}else if(!playing){playing=true;await wake();speak()}};$('pause').onclick=async()=>{paused=true;playing=false;clearTimeout(timer);speechSynthesis.pause();await release();$('progress').textContent+=' · 일시정지'};$('stop').onclick=async()=>{playing=false;paused=false;clearTimeout(timer);speechSynthesis.cancel();await release();$('progress').textContent='정지됨'};$('restart').onclick=async()=>{playing=false;paused=false;clearTimeout(timer);speechSynthesis.cancel();await release();si=0;ri=0;show();$('progress').textContent='처음부터 대기 중'};document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&playing){await wake();if(!speechSynthesis.speaking)speak()}});show();</script></body></html>
